name: powwash_workspace
description: "WhatsApp-style workspace for PowWash Twilio sandbox"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  http_parser: ^4.0.2
  intl: ^0.19.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  file_picker: ^6.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
