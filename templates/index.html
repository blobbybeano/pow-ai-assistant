<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pow AI Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar__header">
          <h1>Pow Team Chat</h1>
          <p>Switch between teammates to steer the conversation.</p>
        </header>
        <nav class="participants" id="participantList"></nav>
      </aside>
      <main class="workspace">
        <header class="workspace__header">
          <div>
            <h2 id="activeName"></h2>
            <p id="activeRole" class="workspace__subtitle"></p>
          </div>
          <div class="workspace__controls">
            <div
              id="personaSwitch"
              class="persona-switch"
              role="group"
              aria-label="Select AI persona"
            ></div>
            <label class="toggle">
              <input type="checkbox" id="autoToggle" checked />
              <span class="toggle__track"></span>
              <span class="toggle__label">Auto AI replies</span>
            </label>
          </div>
        </header>
        <section class="messages" id="messageList"></section>
        <section class="ai-preview hidden" id="aiPreview">
          <div class="ai-preview__bubble">
            <div class="ai-preview__avatar">
              <img id="previewAvatar" alt="" />
            </div>
            <div class="ai-preview__body">
              <div class="ai-preview__meta">
                <span class="ai-preview__name" id="previewPersonaName"></span>
                <span class="ai-preview__tone" id="previewPersonaTone"></span>
              </div>
              <div class="ai-preview__typing" id="typingIndicator">
                <span></span><span></span><span></span>
              </div>
              <p id="previewText"></p>
            </div>
          </div>
          <div class="ai-preview__actions">
            <button class="btn btn--primary" id="sendPreview">Send</button>
            <button class="btn" id="cancelPreview">Cancel</button>
          </div>
        </section>
        <footer class="composer">
          <textarea
            id="messageInput"
            rows="2"
            placeholder="Share an update as the selected teammate"
          ></textarea>
          <button class="btn btn--primary" id="sendButton">Send</button>
        </footer>
      </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
