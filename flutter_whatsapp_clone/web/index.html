<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A WhatsApp-inspired chat prototype with AI preview controls." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flutter WhatsApp Clone</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        window.flutterConfiguration = { canvasKitBaseUrl: 'canvaskit/' };
        _flutter.loader.loadEntrypoint({}).then(function (engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function (appRunner) {
          return appRunner.runApp();
        });
      });
    </script>
  </body>
</html>
